<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Skyway Driver</title>
<meta name="description" content="Skyway driver phone page: your job, one big button at a time, navigation, and location sharing. Works offline after the first load.">
<meta name="theme-color" content="#0b2a4a">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skyway Driver">
<meta name="format-detection" content="telephone=no">
<!-- Cloud hooks for the connect link (driver.html?t=<token>): the Edge Functions base URL, e.g.
     https://<ref>.supabase.co/functions/v1, and (only if connect-invite is deployed WITH JWT checks) the
     public anon key. Both empty = no-backend mode: consent is still recorded on the phone and rides along
     in the first "L" location text. See docs/SETUP.md. -->
<meta name="skyway-functions" content="">
<meta name="skyway-anon-key" content="">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b2a4a'/%3E%3Cpath d='M14 38l5-12a4 4 0 0 1 3.7-2.5h18.6A4 4 0 0 1 45 26l5 12v11a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3H21v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2z' fill='%23f3c548'/%3E%3Ccircle cx='22' cy='40' r='3.2' fill='%230b2a4a'/%3E%3Ccircle cx='42' cy='40' r='3.2' fill='%230b2a4a'/%3E%3Cpath d='M20 36l3.5-8.5h17L44 36z' fill='%230b2a4a' opacity='.55'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b2a4a'/%3E%3Cpath d='M14 38l5-12a4 4 0 0 1 3.7-2.5h18.6A4 4 0 0 1 45 26l5 12v11a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3H21v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2z' fill='%23f3c548'/%3E%3Ccircle cx='22' cy='40' r='3.2' fill='%230b2a4a'/%3E%3Ccircle cx='42' cy='40' r='3.2' fill='%230b2a4a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="driver.css">
</head>
<body>
<header class="top" id="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="28" height="28"><rect width="64" height="64" rx="14" fill="#0b2a4a"/><path d="M14 38l5-12a4 4 0 0 1 3.7-2.5h18.6A4 4 0 0 1 45 26l5 12v11a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3H21v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2z" fill="#f3c548"/><circle cx="22" cy="40" r="3.2" fill="#0b2a4a"/><circle cx="42" cy="40" r="3.2" fill="#0b2a4a"/></svg>
    </span>
    <div class="brand-text">
      <div class="biz" id="bizName">Skyway Driver</div>
      <div class="who" id="drvName"></div>
    </div>
  </div>
  <div class="chips">
    <span class="chip" id="netChip" title="Connection">online</span>
    <span class="chip dim" id="shiftChip" title="Off shift — this phone is not sharing its location">off shift</span>
    <span class="chip live hidden" id="gpsChip" title="Dispatch can see this phone's location (only while On shift)">📡 live</span>
    <span class="chip hidden" id="wakeChip" title="Screen stays on while you are on a job">screen awake</span>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite">
  <!-- driver.js renders the On shift / Off shift switch (#shiftCard) and then one of:
       #scr-job, #scr-rail, #scr-done, #scr-nojob, #scr-connect (driver.html?t=<token>: consent sentence + "I agree",
       owner decision 7). Location is shared only while On shift and only after "I agree". -->
  <noscript><p class="card">Skyway Driver needs JavaScript turned on.</p></noscript>
</main>

<footer class="foot" id="foot"></footer>
<div class="toast" id="toast" role="status"></div>
<script src="driver.js"></script>
</body>
</html>
